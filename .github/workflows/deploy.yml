# Publish Loci to GitHub Pages: https://marcolobato.github.io/loci/
# Runs on every push to main (and can be started by hand from the Actions tab).
# It installs the packages, checks the tokens, builds the app, and publishes
# the "dist" folder.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What this workflow is allowed to do: read the code, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same rule as on your computer: no raw colors or px outside tokens.css.
      - run: npm run check:tokens
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
