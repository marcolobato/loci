<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page reach under the phone's rounded corners
         and home bar; CSS then keeps content clear of them with safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Loci</title>

    <!-- Installable app: name, icon and colors live in the manifest.
         Paths are relative (no leading /), so they also work when the app
         is published in a sub-folder, e.g. on GitHub Pages. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <!-- iPhone reads its Home Screen icon and full-screen mode from these tags. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Loci" />
    <!-- black-translucent: the page draws under the status bar; the safe-area
         padding in index.css keeps the content clear of it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Theme color: iPhone paints it around a Home Screen app, including the
         bottom strip where Safari's toolbar would be. Dark stone ground, so
         that strip blends into the granite instead of showing as a teal bar.
         Raw hex here because HTML can't read CSS tokens; it matches
         --stone-ground in src/tokens.css (and theme_color in the manifest). -->
    <meta name="theme-color" content="#0B1A21" />

    <!-- Fonts: Source Serif 4 for words, Source Code Pro for data.
         The two "preconnect" lines open the connection to Google Fonts early,
         so the fonts arrive sooner. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loads every weight (200–900) in one variable font file per family.
         "display=swap" shows text in a fallback font until these load. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,200..900&family=Source+Code+Pro:wght@200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
